[project]
name = "mcp-enterprise-patterns"
version = "0.1.0"
description = "Production-grade patterns for building enterprise MCP servers — config, structured errors, validation, observability, and a tool registry."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Justin Newcom" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "enterprise", "patterns", "tooling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/j-newcom/mcp-enterprise-patterns"
Repository = "https://github.com/j-newcom/mcp-enterprise-patterns"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_patterns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
